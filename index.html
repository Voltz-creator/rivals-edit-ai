<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rivals Edit AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Rivals Edit AI</h1>
        <p>Create your edit plan in seconds.</p>
    </header>

    <main>

        <section class="editor-box">

            <label for="clip">Describe your clip</label>

            <textarea
                id="clip"
                placeholder="Example: I have 3 quick sniper kills. I want a fast edit with text, transitions and effects on the kills.">
            </textarea>

            <label for="style">Editing style</label>

            <select id="style">
                <option value="dynamic">Dynamic</option>
                <option value="phonk">Phonk</option>
                <option value="clean">Clean</option>
                <option value="cinematic">Cinematic</option>
            </select>

            <button id="generate">
                ✨ Generate Edit
            </button>

        </section>

        <section id="result" class="result-box">

            <h2>Your Edit Plan</h2>

            <div id="montage"></div>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
