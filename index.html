<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

            <title>Rivals Edit AI</title>

                <link rel="stylesheet" href="style.css">
                </head>

                <body>

                    <header>
                            <h1>Rivals Edit AI</h1>
                                    <p>Crée ton plan de montage en quelques secondes.</p>
                                        </header>

                                            <main>

                                                    <section class="editor-box">

                                                                <label for="clip">Décris ton clip</label>

                                                                            <textarea
                                                                                            id="clip"
                                                                                                            placeholder="Exemple : J'ai un clip RIVALS avec 3 kills rapides. Je veux un montage dynamique avec du texte, des transitions et des effets sur les kills.">
                                                                                                                        </textarea>

                                                                                                                                    <label for="style">Style du montage</label>

                                                                                                                                                <select id="style">
                                                                                                                                                                <option value="dynamic">Dynamique</option>
                                                                                                                                                                                <option value="phonk">Phonk</option>
                                                                                                                                                                                                <option value="clean">Clean</option>
                                                                                                                                                                                                                <option value="cinematic">Cinematic</option>
                                                                                                                                                                                                                            </select>

                                                                                                                                                                                                                                        <button id="generate">
                                                                                                                                                                                                                                                        ✨ Générer le montage
                                                                                                                                                                                                                                                                    </button>

                                                                                                                                                                                                                                                                            </section>

                                                                                                                                                                                                                                                                                    <section id="result" class="result-box">

                                                                                                                                                                                                                                                                                                <h2>Ton plan de montage</h2>

                                                                                                                                                                                                                                                                                                            <div id="montage"></div>

                                                                                                                                                                                                                                                                                                                    </section>

                                                                                                                                                                                                                                                                                                                        </main>

                                                                                                                                                                                                                                                                                                                            <script src="script.js"></script>

                                                                                                                                                                                                                                                                                                                            </body>

                                                                                                                                                                                                                                                                                                                            </html>
